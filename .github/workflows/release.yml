name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build all editions
        run: |
          bash scripts/make_icons.sh
          bash scripts/create_chrome_apps.sh
          bash scripts/build_native_apps.sh
          bash scripts/build_chromium_apps.sh all

      - name: Package release zips
        run: bash scripts/package_release.sh

      - name: Verify artifacts
        run: |
          set -e
          count=$(ls build/zip/apps/*.zip | wc -l | tr -d ' ')
          echo "per-app zips: $count"
          [ "$count" -ge 40 ]
          for z in build/zip/apps/*.zip; do unzip -tq "$z" >/dev/null; done
          [ -f build/zip/GoogleOnYourMac-Chromium-v${{ github.ref_name }}.zip ]
          [ -f build/zip/GoogleOnYourMac-Chromium-x64-v${{ github.ref_name }}.zip ]
          file build/chromium_apps/Gmail.app/Contents/MacOS/Electron | grep -q arm64
          file build/chromium_apps_x64/Gmail.app/Contents/MacOS/Electron | grep -q x86_64
          for a in build/native_apps/*.app build/chrome_apps/*.app; do
            plutil -lint "$a/Contents/Info.plist" >/dev/null
          done
          echo "all artifacts verified"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(sed "s/{{VERSION}}/${TAG}/g" RELEASE_NOTES.md)"
          gh release create "$TAG" \
            --title "GoogleOnYourMac ${TAG}" \
            --notes "$NOTES" \
            build/zip/apps/*.zip build/zip/GoogleOnYourMac-*.zip
